<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>njemackiudzepu</title>
    <meta name="application-name" content="njemackiudzepu" />
    <meta name="apple-mobile-web-app-title" content="njemackiudzepu" />
    <meta name="description" content="Vježbaj njemački naglas za banku, Amt, posao i liječnika. Reci situaciju, pa govori." />
    <meta name="theme-color" content="#090909" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar">
        <div class="side-top">
          <div class="side-brand">
            <img src="/icon.svg" alt="" width="28" height="28" class="side-logo" />
            <span id="side-wordmark" class="side-wordmark">njemackiudzepu</span>
          </div>
          <button type="button" id="btn-new" class="new-chat">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <span id="btn-new-label"></span>
          </button>
          <button type="button" id="btn-review" class="new-chat" aria-pressed="false">
            <span id="btn-review-label"></span>
          </button>
        </div>
        <p class="side-kicker" id="label-chats"></p>
        <div id="chat-list" class="chat-list"></div>
        <div class="side-foot">
          <div id="profile-menu" class="profile-menu" hidden role="menu">
            <button type="button" id="btn-settings" class="profile-menu-item" role="menuitem">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7" />
                <path
                  d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6.2 6.2l1.6 1.6M16.2 16.2l1.6 1.6M17.8 6.2l-1.6 1.6M7.8 16.2l-1.6 1.6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
              </svg>
              <span id="btn-settings-label"></span>
            </button>
            <button type="button" id="btn-about" class="profile-menu-item" role="menuitem">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.7" />
                <path d="M12 11v5M12 8h.01" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
              <span id="btn-about-label"></span>
            </button>
          </div>
          <button
            type="button"
            id="btn-profile"
            class="side-item profile"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="profile-menu"
          >
            <span class="avatar" aria-hidden="true">n</span>
            <span class="side-item-copy">
              <span id="btn-profile-label"></span>
              <span id="btn-profile-sub"></span>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path d="M8 10l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </aside>
      <div class="stage">
        <header class="top">
          <button type="button" id="btn-sidebar" class="icon-btn" aria-label="Izbornik">
            <span></span><span></span><span></span>
          </button>
          <p id="wordmark" class="wordmark">njemackiudzepu</p>
        </header>
        <main class="scroll">
          <p id="chrome-warning" class="banner" hidden></p>
          <div id="error" class="banner bad" role="alert" hidden>
            <span id="error-message"></span>
            <button type="button" id="btn-retry-failed" hidden></button>
          </div>
          <section id="thread" class="thread" aria-live="polite"></section>
          <section id="card" class="card" hidden></section>
          <section id="review" class="card" aria-labelledby="review-title" hidden></section>
        </main>
        <footer class="dock">
          <p id="composer-status" class="practice-status" role="status" aria-live="polite"></p>
          <form id="form-composer" class="composer">
            <label class="sr" for="composer-input">Opiši situaciju na hrvatskom</label>
            <textarea id="composer-input" rows="1" maxlength="2000" required></textarea>
            <button type="button" id="btn-dictate" class="icon-btn mic-btn" aria-label="Reci situaciju">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" />
                <path d="M6 11a6 6 0 0 0 12 0M12 17v3" fill="none" stroke="currentColor" stroke-width="1.8" />
              </svg>
            </button>
            <button type="submit" id="btn-send" class="send">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="currentColor" d="M12 3.2 20.2 12l-2.4 2.3-4.3-4.3V20.8h-3V10l-4.3 4.3L3.8 12z" />
              </svg>
            </button>
          </form>
        </footer>
      </div>
    </div>
    <div id="sidebar-backdrop" class="backdrop" hidden></div>

    <dialog id="dlg-settings">
      <form id="form-settings" method="dialog">
        <h2 id="dlg-settings-title">Postavke</h2>
        <label><span id="set-rate-label"></span> <input id="set-rate" type="range" min="0.7" max="1.15" step="0.05" /></label>
        <label class="check"><input id="set-mic" type="checkbox" /> <span id="set-mic-label"></span></label>
        <label class="check"><input id="set-voice" type="checkbox" /> <span id="set-voice-label"></span></label>
        <div class="row">
          <button type="submit" class="primary">Spremi</button>
          <button type="button" data-close>Zatvori</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlg-about">
      <h2 id="dlg-about-title">O aplikaciji</h2>
      <div id="about-body"></div>
      <button type="button" data-close>Zatvori</button>
    </dialog>

    <script src="/js/strings.hr.js"></script>
    <script src="/js/speech.js"></script>
    <script src="/js/scoring.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/conversation.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
