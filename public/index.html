<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>njemackuudzepu</title>
    <meta name="application-name" content="njemackuudzepu" />
    <meta name="apple-mobile-web-app-title" content="njemackuudzepu" />
    <meta name="description" content="Njemačku u džepu. Reci situaciju, pa govori." />
    <meta name="theme-color" content="#090909" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,ital,wght@8..60,0,500;8..60,0,600;8..60,1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar">
        <button type="button" id="btn-new" class="new-chat"></button>
        <p class="side-kicker" id="label-chats"></p>
        <div id="chat-list" class="chat-list"></div>
      </aside>
      <div class="stage">
        <header class="top">
          <button type="button" id="btn-sidebar" class="icon-btn" aria-label="Izbornik">
            <span></span><span></span><span></span>
          </button>
          <p id="wordmark" class="wordmark">njemackuudzepu</p>
          <nav>
            <button type="button" id="btn-settings" class="ghost">Postavke</button>
            <button type="button" id="btn-about" class="ghost">O aplikaciji</button>
          </nav>
        </header>
        <main class="scroll">
          <p id="chrome-warning" class="banner" hidden></p>
          <p id="error" class="banner bad" hidden></p>
          <section id="thread" class="thread" aria-live="polite"></section>
          <section id="card" class="card" hidden></section>
        </main>
        <footer class="dock">
          <div id="chips" class="chips"></div>
          <form id="form-composer" class="composer">
            <label class="sr" for="composer-input">Opiši situaciju</label>
            <textarea id="composer-input" rows="1" required></textarea>
            <button type="button" id="btn-dictate" class="icon-btn mic-btn" aria-label="Reci situaciju">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" />
                <path d="M6 11a6 6 0 0 0 12 0M12 17v3" fill="none" stroke="currentColor" stroke-width="1.8" />
              </svg>
            </button>
            <button type="submit" id="btn-send" class="send"></button>
          </form>
          <div class="home-meta">
            <label><span id="label-level"></span> <select id="sel-level"></select></label>
            <label><span id="label-formality"></span> <select id="sel-formality"></select></label>
            <span id="enter-hint" class="hint"></span>
          </div>
        </footer>
      </div>
    </div>
    <div id="sidebar-backdrop" class="backdrop" hidden></div>

    <dialog id="dlg-settings">
      <form id="form-settings" method="dialog">
        <h2 id="dlg-settings-title">Postavke</h2>
        <label><span id="set-level-label"></span> <select id="set-level"></select></label>
        <label><span id="set-form-label"></span> <select id="set-form"></select></label>
        <label><span id="set-rate-label"></span> <input id="set-rate" type="range" min="0.7" max="1.15" step="0.05" /></label>
        <label class="check"><input id="set-mic" type="checkbox" /> <span id="set-mic-label"></span></label>
        <label class="check"><input id="set-voice" type="checkbox" /> <span id="set-voice-label"></span></label>
        <div class="row">
          <button type="submit" class="primary">Spremi</button>
          <button type="button" data-close>Zatvori</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlg-about">
      <h2 id="dlg-about-title">O aplikaciji</h2>
      <div id="about-body"></div>
      <button type="button" data-close>Zatvori</button>
    </dialog>

    <script src="/js/strings.hr.js"></script>
    <script src="/js/speech.js"></script>
    <script src="/js/scoring.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/conversation.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
