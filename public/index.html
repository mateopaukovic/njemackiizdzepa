<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>njemackuudzepu</title>
    <meta name="application-name" content="njemackuudzepu" />
    <meta name="apple-mobile-web-app-title" content="njemackuudzepu" />
    <meta name="description" content="Njemačku u džepu. Reci situaciju, pa govori." />
    <meta name="theme-color" content="#1c1612" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,ital,wght@8..60,0,500;8..60,0,600;8..60,1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="stripe" aria-hidden="true"></div>
    <header class="top">
      <p id="wordmark" class="wordmark">njemackuudzepu</p>
      <nav>
        <button type="button" id="btn-settings" class="ghost">Postavke</button>
        <button type="button" id="btn-about" class="ghost">O aplikaciji</button>
      </nav>
    </header>

    <main>
      <p id="tagline" class="tagline"></p>
      <p id="chrome-warning" class="banner" hidden></p>
      <p id="error" class="banner bad" hidden></p>

      <section id="thread" class="thread" aria-live="polite"></section>
      <section id="card" class="card" hidden></section>

      <form id="form-composer" class="composer">
        <label class="sr" for="composer-input">Opiši situaciju</label>
        <textarea id="composer-input" rows="2" required></textarea>
        <button type="submit" id="btn-send" class="primary">Pošalji</button>
      </form>

      <div id="chips" class="chips"></div>
      <div class="home-meta">
        <label><span id="label-level"></span> <select id="sel-level"></select></label>
        <label><span id="label-formality"></span> <select id="sel-formality"></select></label>
      </div>
    </main>

    <dialog id="dlg-settings">
      <form id="form-settings" method="dialog">
        <h2 id="dlg-settings-title">Postavke</h2>
        <label><span id="set-level-label"></span> <select id="set-level"></select></label>
        <label><span id="set-form-label"></span> <select id="set-form"></select></label>
        <label><span id="set-rate-label"></span> <input id="set-rate" type="range" min="0.7" max="1.15" step="0.05" /></label>
        <label class="check"><input id="set-mic" type="checkbox" /> <span id="set-mic-label"></span></label>
        <label class="check"><input id="set-voice" type="checkbox" /> <span id="set-voice-label"></span></label>
        <div class="row">
          <button type="submit" class="primary">Spremi</button>
          <button type="button" data-close>Zatvori</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlg-about">
      <h2 id="dlg-about-title">O aplikaciji</h2>
      <div id="about-body"></div>
      <button type="button" data-close>Zatvori</button>
    </dialog>

    <script src="/js/strings.hr.js"></script>
    <script src="/js/speech.js"></script>
    <script src="/js/scoring.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/conversation.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
